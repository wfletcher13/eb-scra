<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRA Packages</title>
<style>
:root{
  --bg:#f6f7f8; --panel:#fff; --ink:#16191d; --muted:#61696f; --line:#dfe3e7;
  --accent:#1f5f8b; --accent-soft:#e8f0f6;
  --measured:#146b3c; --measured-bg:#e4f3ea;
  --placeholder:#8a5a00; --placeholder-bg:#fdf2dc;
  --derived:#3a4a7a; --derived-bg:#eaeefa;
  --stated:#4a4f55; --stated-bg:#eef0f2;
  --missing:#9a2222; --missing-bg:#fbeaea;
  --warn:#9a2222; --warn-bg:#fbeaea;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#15181b; --panel:#1d2126; --ink:#e8eaec; --muted:#98a1a9; --line:#2f353c;
    --accent:#6fb1dc; --accent-soft:#1c2a35;
    --measured:#6cd39a; --measured-bg:#14301f;
    --placeholder:#e8b25e; --placeholder-bg:#33260f;
    --derived:#9db0ea; --derived-bg:#1b2238;
    --stated:#aab2ba; --stated-bg:#252a30;
    --missing:#ef8d8d; --missing-bg:#33191a;
    --warn:#ef8d8d; --warn-bg:#33191a;
  }
}
:root[data-theme="dark"]{
  --bg:#15181b; --panel:#1d2126; --ink:#e8eaec; --muted:#98a1a9; --line:#2f353c;
  --accent:#6fb1dc; --accent-soft:#1c2a35;
  --measured:#6cd39a; --measured-bg:#14301f;
  --placeholder:#e8b25e; --placeholder-bg:#33260f;
  --derived:#9db0ea; --derived-bg:#1b2238;
  --stated:#aab2ba; --stated-bg:#252a30;
  --missing:#ef8d8d; --missing-bg:#33191a;
  --warn:#ef8d8d; --warn-bg:#33191a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{background:var(--panel);border-bottom:1px solid var(--line);
  padding:14px 16px;position:sticky;top:0;z-index:5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.hdr{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.2px}
h2{font-size:16px;margin:26px 0 10px}
h3{font-size:14px;margin:18px 0 8px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent);font-weight:600}
.ro{background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:6px;padding:9px 12px;margin:14px 0;font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:14px 16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;white-space:nowrap}
tbody tr:hover{background:var(--accent-soft)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;
  padding:1px 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.c-measured{color:var(--measured);background:var(--measured-bg);border-color:var(--measured)}
.c-placeholder{color:var(--placeholder);background:var(--placeholder-bg);
  border-color:var(--placeholder);border-style:dashed}
.c-derived{color:var(--derived);background:var(--derived-bg);border-color:var(--derived)}
.c-stated{color:var(--stated);background:var(--stated-bg);border-color:var(--stated)}
.c-sourcedoc{color:var(--stated);background:var(--stated-bg);border-color:var(--stated)}
.c-missing{color:var(--missing);background:var(--missing-bg);border-color:var(--missing)}
.absent{color:var(--muted);font-style:italic}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.banner{border-radius:8px;padding:10px 13px;margin:12px 0;font-size:13.5px;
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn)}
.muted{color:var(--muted)}
.ok{border-radius:8px;padding:10px 13px;margin:12px 0;font-size:13.5px;
  background:var(--measured-bg);border:1px solid var(--measured);color:var(--measured)}
pre.prompt{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;
  margin:8px 0 10px;max-height:260px;overflow:auto}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.rmsg{min-height:1.2em}
.small{font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
  background:var(--bg);color:var(--muted)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--ink)}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;
  display:flex;min-width:120px}
.bar i{display:block;height:100%}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;
  background:var(--panel)}
summary{cursor:pointer;font-weight:600;font-size:13.5px}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.dpline{position:relative;height:30px;margin:6px 0 2px}
.dpline .track{position:absolute;top:13px;left:0;right:0;height:4px;
  background:var(--line);border-radius:2px}
.dpline .band{position:absolute;top:9px;height:12px;background:var(--accent-soft);
  border-left:1px solid var(--accent);border-right:1px solid var(--accent)}
.dpline .span{position:absolute;top:12px;height:6px;background:var(--accent);border-radius:3px}
.dpline .tick{position:absolute;top:2px;font-size:10px;color:var(--muted)}
svg text{fill:var(--muted);font-size:10px}
footer{padding:26px 16px 40px;color:var(--muted);font-size:12.5px}
@media (max-width:640px){ .hdr{gap:8px} nav{width:100%} h1{font-size:16px} }
</style>
</head>
<body>
<header><div class="wrap hdr">
  <h1>SCRA Packages</h1>
  <span class="pill" id="genstamp"></span>
  <nav>
    <button data-view="list" aria-current="true">Projects</button>
    <button data-view="trends">Trends</button>
    <button data-view="about">Provenance</button>
    <button data-view="settings">Settings</button>
  </nav>
</div></header>

<main class="wrap" id="main"></main>

<footer class="wrap">
  Read only. The record is the source of truth and this page is a lens over it.
  Deleting the viewer loses nothing. This page holds no project data of its own:
  it reads the local <code>packages.js</code> bundle, or a private repository with
  a read-only token this device holds.
</footer>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   Two sources, one viewer.

   Local:   packages.js sits beside this file in the OneDrive folder and the
            page reads it directly. Nothing else is needed and nothing leaves
            the machine.
   Hosted:  this file is served from GitHub Pages, which is public, so it
            carries no project data at all. The records live in a private
            repository and the device holds a read-only token for it. The token
            arrives once by setup link or QR code and stays in this browser.

   The token is scoped to Contents: Read on the data repository and nothing
   else, so a device that has it can read the records and cannot change them.
   Treat the setup link like a password anyway.
--------------------------------------------------------------------------- */

const LS_CFG = "eb_scra_cfg_v1";
const LS_CACHE = "eb_scra_cache_v1";

let DATA = null;
let SOURCE = "none";     // local | github | cache | none
let LOADERR = null;

const b64url = {
  enc: s => btoa(unescape(encodeURIComponent(s)))
              .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),
  dec: s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))))
};

function loadCfg(){
  try { return JSON.parse(localStorage.getItem(LS_CFG) || "null") || {}; }
  catch { return {}; }
}
function saveCfg(c){
  try { localStorage.setItem(LS_CFG, JSON.stringify(c)); return true; }
  catch { return false; }
}
let CFG = loadCfg();

function readCache(){
  try { return JSON.parse(localStorage.getItem(LS_CACHE) || "null"); }
  catch { return null; }
}
function writeCache(d){
  // Best effort. A record set too big for this browser's quota is not an error
  // worth stopping for; the next open just fetches again.
  try { localStorage.setItem(LS_CACHE, JSON.stringify(d)); }
  catch { try { localStorage.removeItem(LS_CACHE); } catch {} }
}

async function ghRaw(cfg, path){
  const url = "https://api.github.com/repos/" + encodeURIComponent(cfg.owner)
    + "/" + encodeURIComponent(cfg.repo) + "/contents/" + path
    + "?ref=" + encodeURIComponent(cfg.branch || "main");
  const r = await fetch(url, {headers: {
    "Authorization": "Bearer " + cfg.token,
    "Accept": "application/vnd.github.raw",
    "X-GitHub-Api-Version": "2022-11-28"
  }});
  if (r.status === 404) return null;
  if (r.status === 401 || r.status === 403)
    throw new Error("GitHub refused the token (HTTP " + r.status + "). It needs "
      + "Contents: Read on " + cfg.owner + "/" + cfg.repo + ", and it may have expired.");
  if (!r.ok) throw new Error("GitHub returned HTTP " + r.status + " for " + path);
  return JSON.parse(await r.text());
}

async function fetchFromGitHub(cfg){
  const index = await ghRaw(cfg, "index.json");
  if (!index) throw new Error("No index.json in " + cfg.owner + "/" + cfg.repo
    + ". Publish the packages first with scra_publish.py.");
  const records = {};
  // Sequential on purpose. A handful of projects, and GitHub rate limits a burst
  // of parallel reads from one token more readily than it does a short series.
  for (const p of (index.packages || [])){
    const rec = await ghRaw(cfg, p.slug + "/project.json");
    if (rec) records[p.slug] = rec;
  }
  return {index, records, fetchedAt: new Date().toISOString()};
}

/* The folder copy sits beside packages.js; the hosted copy does not have one.
   A device holding a token is the hosted case by definition, so the bundle is
   not requested there at all and no 404 is logged. file:// and https:// have
   separate localStorage, so a folder copy never sees a hosted device's token. */
function loadBundle(){
  if (window.SCRA_DATA) return Promise.resolve(true);
  if (CFG.owner && CFG.repo && CFG.token) return Promise.resolve(false);
  return new Promise(res => {
    const s = document.createElement("script");
    s.src = "packages.js";
    s.onload = () => res(!!window.SCRA_DATA);
    s.onerror = () => res(false);
    document.head.appendChild(s);
  });
}

async function boot(){
  if (await loadBundle()){
    DATA = window.SCRA_DATA; SOURCE = "local"; render(); return;
  }
  const cached = readCache();
  if (cached){ DATA = cached; SOURCE = "cache"; render(); }
  if (!(CFG.owner && CFG.repo && CFG.token)){ render(); return; }
  try {
    const d = await fetchFromGitHub(CFG);
    DATA = d; SOURCE = "github"; LOADERR = null; writeCache(d);
  } catch (e){
    LOADERR = e.message;
  }
  render();
}

/* ---------- setup by link or QR, the SC Inspect flow ---------------------- */

function setupCode(){
  return b64url.enc(JSON.stringify({o: CFG.owner, r: CFG.repo, t: CFG.token}));
}
function setupLink(){
  return location.origin + location.pathname + "#s=" + setupCode();
}
function parseSetup(t){
  let s = (t || "").trim();
  const at = s.indexOf("#s=");
  if (at >= 0) s = s.slice(at + 3);
  s = s.split(/[\s&]/)[0];
  if (!s) throw new Error("That is empty.");
  let o;
  try { o = JSON.parse(b64url.dec(s)); }
  catch { throw new Error("That does not look like a setup link. Copy the whole "
    + "link, including the part after the #."); }
  if (!o || !o.o || !o.r || !o.t) throw new Error("That setup link is incomplete.");
  return o;
}
function setupFromHash(){
  const h = location.hash || "";
  if (h.indexOf("#s=") !== 0) return false;
  let o; try { o = parseSetup(h); } catch { return false; }
  history.replaceState(null, "", location.pathname + location.search); // token out of the address bar
  if (confirm("Set up this device to read " + o.o + "/" + o.r + "?\n\n"
      + "This installs a read-only access token for the SCRA records. Only "
      + "accept it if you asked for it.")){
    CFG = {owner: o.o, repo: o.r, token: o.t, branch: CFG.branch || "main"};
    saveCfg(CFG);
    location.hash = "list";
    boot();
  }
  return true;
}

async function testConnection(cfg){
  const idx = await fetchFromGitHub(cfg);
  return idx.index.count + " package(s) readable in " + cfg.owner + "/" + cfg.repo;
}
const ABSENT = '<span class="absent">not recorded</span>';
const $ = (s,r) => (r||document).querySelector(s);
const main = document.getElementById("main");

/* ---------- value helpers. A missing value is named, never blanked. -------- */
function val(v){ return (v && typeof v === "object" && !Array.isArray(v)) ? v.value : v; }
function num(v){
  const x = val(v);
  if (x === null || x === undefined || x === "") return null;
  const n = Number(String(x).replace(/,/g,""));
  return Number.isFinite(n) ? n : null;
}
function chipOf(v){
  if (!v || typeof v !== "object") return (v===null||v===undefined||v==="") ? "missing" : "stated";
  if (v.value === null || v.value === undefined || v.value === "") return "missing";
  const s = v.source;
  if (v.placeholder || s === "trendline") return "placeholder";
  if (s === "contamx" && v.measured) return "measured";
  if (typeof s === "string" && s.startsWith("derived")) return "derived";
  if (["elss","drawing","mep","handbook","prior-report"].includes(s)) return "sourcedoc";
  return "stated";
}
const CHIPLABEL = {measured:"Measured",placeholder:"Placeholder",derived:"Derived",
  stated:"Stated",sourcedoc:"Source doc",missing:"Missing"};
function chipHtml(kind){
  return `<span class="chip c-${kind}">${CHIPLABEL[kind]}</span>`;
}
function esc(s){
  return String(s===null||s===undefined?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function text(v){
  const x = val(v);
  return (x===null||x===undefined||x==="") ? ABSENT : esc(x);
}
function cfm(v){
  const n = num(v);
  return n === null ? ABSENT : n.toLocaleString("en-US",{maximumFractionDigits:0});
}
function cfmChip(v){
  const n = num(v);
  if (n === null) return ABSENT + " " + chipHtml("missing");
  return `${n.toLocaleString("en-US",{maximumFractionDigits:0})} ${chipHtml(chipOf(v))}`;
}
function systemsOf(rec){
  const out = [];
  (rec.stairs||[]).forEach(s => out.push({cls:"stair", s}));
  (rec.elevators||[]).forEach(s => out.push({cls:"elevator", s}));
  (rec.other_systems||[]).forEach(s => out.push({cls:"other", s}));
  return out;
}
function minDpFor(rec, cls, s){
  const c = rec.criteria || {};
  if (cls === "stair") return num(s.vestibule && s.vestibule_pressurized
    ? c.MinimumPressure_vest : c.MinimumPressure_novest);
  if (cls === "elevator") return num(c.MinimumPressure_novest);
  return null;
}
function bandFor(rec, cls){
  const c = rec.criteria || {};
  if (cls === "stair") return [num(c.stair_band_min), num(c.stair_band_max)];
  if (cls === "elevator") return [num(c.elev_band_min), num(c.elev_band_max)];
  return [null,null];
}
function openConflicts(rec){
  return ((rec._meta||{}).conflicts||[]).filter(c => c.status !== "resolved");
}

/* ---------- door force: Handbook Eq. 9.3, report time post process --------- */
function doorLeaf(rec){
  const c = rec.criteria || {}, d = c.door_defaults || {};
  return { W:+(d.leaf_W_ft ?? 3.0), A:+(d.leaf_A_sf ?? 21.0), d:+(d.leaf_d_ft ?? 0.25),
           Fdc:+(d.Fdc_lbf ?? 9.0), basis:d.Fdc_basis || "documented assumption",
           limit:+(c.door_force_limit_lbf ?? 30) };
}
function initiateForce(dp, L){ return L.Fdc + 5.2*dp*L.W*L.A/(2*(L.W-L.d)); }

/* ---------- routing ------------------------------------------------------- */
function route(){
  const h = location.hash.replace(/^#/,"");
  const [view, slug, sub] = h.split("/");
  return { view: view || "list", slug, sub };
}
window.addEventListener("hashchange", () => {
  if (setupFromHash()) return;
  render();
});
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => { location.hash = b.dataset.view; });
});

/* ---------- views --------------------------------------------------------- */
function viewList(){
  const pkgs = DATA.index.packages;
  const rows = pkgs.map(p => {
    const c = p.conflicts, cov = p.coverage || {};
    const track = p.building_status
      ? `<span class="pill">${esc(p.building_status === "new" ? "New" : "Existing")}</span>`
      : `<span class="chip c-missing">Missing</span>`;
    const meas = p.measured
      ? chipHtml("measured")
      : (cov.placeholder ? chipHtml("placeholder") : chipHtml("missing"));
    const blocking = c.open_blocking
      ? ` <span class="chip c-missing">${c.open_blocking} blocking</span>` : "";
    return `<tr>
      <td><a href="#project/${esc(p.slug)}"><strong>${esc(p.name||p.slug)}</strong></a>
          <div class="small muted">${esc(p.location||"")}</div></td>
      <td>${track}</td>
      <td>${p.stories ? esc(p.stories) : ABSENT}</td>
      <td class="small">${p.counts.stairs} stair, ${p.counts.elevators_pressurized} bank,
          ${p.counts.other} other</td>
      <td>${meas}</td>
      <td>${c.open}${blocking}<div class="small muted">${c.resolved} resolved</div></td>
      <td>${p.seal.sealed ? "sealed" : '<span class="muted">not sealed</span>'}
          ${(p.lint && p.lint.ran && p.lint.errors)
            ? `<div><span class="chip c-missing">${p.lint.errors} lint error</span></div>` : ""}</td>
      <td class="small">${esc(p.lastWriteBy||"")}<div class="muted">${esc(p.lastWriteAt||"")}</div></td>
    </tr>`;
  }).join("");

  return `
  <div class="ro"><strong>Read only.</strong> This page never writes to a package.
    Resolving an open item happens in the record, through the lane that owns it.
    A viewer that could write would be a second place the truth lives.</div>
  <div class="row" style="margin:14px 0">
    <input type="search" id="q" placeholder="Filter projects" style="flex:1;min-width:180px">
    <select id="ftrack"><option value="">Any track</option>
      <option value="new">New</option><option value="existing">Existing</option></select>
    <select id="fmeas"><option value="">Any sizing</option>
      <option value="1">Measured</option><option value="0">No measured sizing</option></select>
    <label class="small muted"><input type="checkbox" id="fblock"> Blocking items only</label>
  </div>
  <div class="card scroll"><table id="ptable">
    <thead><tr><th>Project</th><th>Track</th><th>Stories</th><th>Systems</th>
      <th>Sizing</th><th>Open items</th><th>Seal</th><th>Last write</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" class="absent">No packages indexed.</td></tr>'}</tbody>
  </table></div>`;
}

function wireList(){
  const q = $("#q"), ft = $("#ftrack"), fm = $("#fmeas"), fb = $("#fblock");
  if (!q) return;
  const pkgs = DATA.index.packages;
  function apply(){
    const term = q.value.toLowerCase();
    document.querySelectorAll("#ptable tbody tr").forEach((tr,i) => {
      const p = pkgs[i]; if (!p) return;
      let ok = true;
      if (term) ok = ((p.name||"")+" "+(p.location||"")+" "+p.slug).toLowerCase().includes(term);
      if (ok && ft.value) ok = p.building_status === ft.value;
      if (ok && fm.value) ok = String(p.measured ? 1 : 0) === fm.value;
      if (ok && fb.checked) ok = p.conflicts.open_blocking > 0;
      tr.style.display = ok ? "" : "none";
    });
  }
  [q,ft,fm,fb].forEach(el => el.addEventListener("input", apply));
}

function viewProject(slug, sub){
  const rec = DATA.records[slug];
  if (!rec) return `<div class="banner">No package named ${esc(slug)} in this index.</div>`;
  const info = rec.info||{}, bld = rec.building||{}, meta = rec._meta||{}, seal = rec.seal||{};
  const open = openConflicts(rec), blocking = open.filter(c => c.blocking);
  const tabs = ["overview","systems","cases","conflicts","files","report"];
  const cur = tabs.includes(sub) ? sub : "overview";
  const nav = tabs.map(t =>
    `<button data-tab="${t}" aria-current="${t===cur}"
       onclick="location.hash='project/${esc(slug)}/${t}'">${t[0].toUpperCase()+t.slice(1)}</button>`
  ).join("");

  const head = `
    <div class="row" style="margin:14px 0 4px">
      <a href="#list" class="small">&larr; All projects</a>
    </div>
    <h2 style="margin-top:4px">${text(info.ProjectName)}</h2>
    <div class="row small muted">
      <span>${esc([info.ProjectStreet, info.ProjectLocation, info.ProjectZip]
        .filter(Boolean).join(", "))}</span>
      <span class="pill">AHJ ${esc(info.AHJ||"not recorded")}</span>
      <span class="pill">${bld.building_status
        ? esc(bld.building_status==="new"?"New construction":"Existing building")
        : "track MISSING"}</span>
      <span class="pill">${seal.sealed ? "sealed "+esc(seal.by||"") : "not sealed"}</span>
      <span class="pill">last write ${esc(meta.lastWriteBy||"?")} ${esc(meta.lastWriteAt||"")}</span>
    </div>
    ${lintBanner(slug)}
    ${blocking.length ? `<div class="banner"><strong>${blocking.length} open item${
      blocking.length>1?"s":""} block${blocking.length>1?"":"s"} the seal.</strong>
      ${blocking.map(c=>esc(c.id+" "+c.item)).join("; ")}</div>` : ""}
    <div class="row" style="margin:14px 0 2px">${nav}</div>`;

  const body = {overview:tabOverview, systems:tabSystems, cases:tabCases,
                conflicts:tabConflicts, files:tabFiles, report:tabReport}[cur](rec, slug);
  return head + body;
}

function lintBanner(slug){
  const p = DATA.index.packages.find(x => x.slug === slug) || {};
  const lt = p.lint;
  if (!lt) return "";
  if (!lt.ran) return `<p class="small muted">Lint not run: ${esc(lt.reason||"")}.</p>`;
  const f = lt.findings || [];
  if (!f.length) return `<p class="small muted">scra_lint clean at index time.</p>`;
  const errs = f.filter(x => x.level === "ERROR");
  const body = f.map(x =>
    `<div class="small"><strong>${esc(x.level)}</strong> ${esc(x.code)}
     <span class="muted">${esc(x.where)}</span></div>`).join("");
  return errs.length
    ? `<div class="banner"><strong>${errs.length} lint error${errs.length>1?"s":""}.</strong>
       A record that does not satisfy its own rules should not be projected into a
       report until it does.${body}</div>`
    : `<details><summary>${f.length} lint finding${f.length>1?"s":""}, no errors</summary>
       ${body}<p class="small muted">Run <code>scra_lint.py</code> against the record
       for the full text. The index carries the codes only.</p></details>`;
}

function tabSystems(rec){
  const bal = ((rec.contam||{}).balance)||{};
  const cards = systemsOf(rec).map(({cls,s}) => {
    const b = bal[s.id]||{}, inj = s.injection||{};
    const [blo,bhi] = bandFor(rec, cls), floor = minDpFor(rec, cls, s);
    const dmin = b.dp_min_achieved, dmax = b.dp_max_achieved;
    let band;
    if (b.band_min_cfm === undefined || b.band_min_cfm === null) band = ABSENT;
    else if (b.band_min_cfm === b.band_max_cfm)
      band = `${b.band_min_cfm.toLocaleString()} <span class="muted">converged, band not probed</span>`;
    else band = `${b.band_min_cfm.toLocaleString()} to ${b.band_max_cfm.toLocaleString()}`;
    const spread = b.spread_ratio;

      ? ` <span class="chip c-missing">wide</span>` : "";
    return `<div class="card">
      <div class="row"><strong>${esc(s.label||s.id)}</strong>
        <span class="pill">${cls}</span>
        ${cls==="elevator" ? `<span class="pill">${esc(s.basis||"basis not recorded")}</span>`:""}
        ${cls==="stair" ? `<span class="pill">${s.vestibule_pressurized
          ? "vestibule, pressurized" : s.vestibule ? "vestibule" : "no vestibule"}</span>`:""}
        <span class="pill">${s.levels_served_count != null
          ? esc(s.levels_served_count)+" levels, to "+esc(s.levels||"?")
          : "levels served "+esc(s.levels||"not recorded")}</span>
      </div>
      <dl class="kv" style="margin-top:10px">
        <dt>Design</dt><dd>${cfmChip(s.design)} cfm</dd>
        <dt>Max</dt><dd>${cfmChip(s.max)} cfm <span class="small muted">${
          esc((s.max||{}).source||"")}</span></dd>
        ${Object.keys(b).length ? `
        <dt>Setpoint</dt><dd>${b.setpoint_cfm !== undefined && b.setpoint_cfm !== null
          ? b.setpoint_cfm.toLocaleString()+" cfm" : ABSENT}</dd>
        <dt>Band</dt><dd>${band}</dd>
        <dt>Search</dt><dd>${text(b.search)}${b.iterations!==undefined
          ? ` <span class="small muted">${b.iterations} iterations</span>`:""}</dd>
        <dt>Seed</dt><dd>${cfmChip(b.seed)} cfm</dd>
        <dt>Spread ratio</dt><dd>${spread !== undefined && spread !== null

    </div>`;
  }).join("");
  const anySpread = Object.values(bal).some(b => b.spread_ratio > 1.8);
  return `<p class="small muted">Lists of one to ten. Four stairs and one stair render
    the same way, because the record has no fixed slots.</p>
    ${anySpread ? `<div class="banner">A spread ratio beyond roughly 1.8 to 2.3 means no
      single setpoint fits every case. The remedy is injection architecture, not more air.</div>`:""}

function dpLine(dmin, dmax, floor, blo, bhi){
  if (dmin === undefined || dmin === null || dmax === undefined || dmax === null)
    return `<p class="small absent">No achieved pressure range recorded.</p>`;
  const lo = 0, hi = Math.max(bhi||0, dmax, 0.4) * 1.08;
  const pc = v => ((v - lo) / (hi - lo) * 100).toFixed(2) + "%";
  const bandEl = (blo!=null && bhi!=null)
    ? `<div class="band" style="left:${pc(blo)};width:${((bhi-blo)/(hi-lo)*100).toFixed(2)}%"></div>` : "";
  const floorEl = floor!=null
    ? `<div class="tick" style="left:${pc(floor)}">${floor} min</div>` : "";
  return `<div class="dpline">
      <div class="track"></div>${bandEl}
      <div class="span" style="left:${pc(dmin)};width:${((dmax-dmin)/(hi-lo)*100).toFixed(2)}%"></div>
      ${floorEl}
    </div>
    <div class="small muted">achieved ${dmin.toFixed(3)} to ${dmax.toFixed(3)} in. w.g.${
      (blo!=null&&bhi!=null) ? `, sizer band ${blo} to ${bhi}`:""}${
      floor!=null ? `, compliance floor ${floor}`:""}</div>`;
}

function tabCases(rec){
  const contam = rec.contam||{}, cases = contam.cases||[], bal = contam.balance||{};
  const L = doorLeaf(rec);
  if (!cases.length){
    const rows = Object.entries(bal).map(([sid,b]) => {
      const dp = b.dp_max_achieved;
      const F = (dp!=null) ? initiateForce(dp, L) : null;
      return `<tr><td>${esc(sid)}</td>
        <td>${b.setpoint_cfm!=null ? b.setpoint_cfm.toLocaleString() : ABSENT}</td>
        <td>${(b.cases_passed||[]).join(", ") || ABSENT}</td>
        <td>${b.dp_min_achieved!=null ? b.dp_min_achieved.toFixed(3) : ABSENT}</td>
        <td>${dp!=null ? dp.toFixed(3) : ABSENT}</td>
        <td>${F!=null ? F.toFixed(1)+" lbf" : ABSENT}</td>
        <td>${F!=null ? (F>L.limit ? '<span class="chip c-missing">above</span>' : "within") : ABSENT}</td>
      </tr>`;
    }).join("");
    const common = Object.values(bal).filter(b => (b.cases_passed||[]).length > 1
      && b.band_min_cfm === b.band_max_cfm).length;
    return `<div class="banner">No case matrix recorded on this package. The balance
      block carries the setpoint, the achieved range and the case ids that passed;
      the per case detail is not in the record yet.</div>
      ${common ? `<p class="small"><span class="chip c-measured">Common setpoint</span>
        ${common} system${common===1?"":"s"} pass every recorded case at one CFM.
        One setpoint by construction, not a winner picked across cases.</p>` : ""}
      <div class="card scroll"><table>
        <thead><tr><th>System</th><th>Setpoint</th><th>Cases passed</th><th>dP min</th>
        <th>dP max</th><th>Initiate force</th><th>vs ${L.limit} lbf</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="absent">No balance block either.</td></tr>'}</tbody>
      </table></div>
      <p class="small muted">Force computed at the maximum achieved pressure by Handbook
        Eq. 9.3, leaf W ${L.W} ft, A ${L.A} sf, d ${L.d} ft, Fdc ${L.Fdc} lbf
        (${esc(L.basis)}). Report time only: door force never enters the CFM search.</p>`;
  }
  const bySys = {};
  cases.forEach(c => Object.entries(c.results||{}).forEach(([sid,r]) => {
    (bySys[sid] = bySys[sid] || []).push({c,r});
  }));
  return Object.entries(bySys).map(([sid, items]) => {
    const setpoints = new Set(items.map(x => x.r.ahs_cfm));
    const same = setpoints.size === 1 && items.length > 1;
    const rows = items.map(({c,r}) => {
      const dmin = r.dp_min||{}, dmax = r.dp_max||{};
      return `<tr>
        <td>${esc(c.case_id)}</td><td>${esc(c.season||"")}</td>
        <td>${esc(c.outdoor_f ?? "")} / ${esc(c.shaft_f ?? "")}</td>
        <td>${esc(c.wind_mph ?? "")}</td>
        <td>${r.ahs_cfm!=null ? r.ahs_cfm.toLocaleString() : ABSENT}</td>
        <td>${dmin.value!=null ? dmin.value.toFixed(3)+" @ "+esc(dmin.floor) : ABSENT}</td>
        <td>${dmax.value!=null ? dmax.value.toFixed(3)+" @ "+esc(dmax.floor) : ABSENT}</td>
        <td>${r.pass_min_dp===true?"pass":r.pass_min_dp===false?
          '<span class="chip c-missing">fail</span>':ABSENT}</td>
        <td>${(r.flags||[]).join(", ")||"none"}</td></tr>`;
    }).join("");
    const profiles = items.filter(x => x.r.dp_by_floor).map(({c,r}) =>
      `<details><summary>${esc(c.case_id)} per floor profile</summary>
        ${profileSvg(r.dp_by_floor, rec)}</details>`).join("");
    return `<h3>${esc(sid)}</h3>
      ${same ? `<p class="small"><span class="chip c-measured">Common setpoint</span>
        ${[...setpoints][0].toLocaleString()} cfm across ${items.length} cases.
        One setpoint by construction, not a winner picked across cases.</p>`:""}
      <div class="card scroll"><table>
        <thead><tr><th>Case</th><th>Season</th><th>Outdoor / shaft F</th><th>Wind</th>
        <th>AHS cfm</th><th>dP min</th><th>dP max</th><th>Passes min</th><th>Flags</th></tr></thead>
        <tbody>${rows}</tbody></table></div>${profiles}`;
  }).join("");
}

function profileSvg(prof, rec){
  const entries = Object.entries(prof)
    .map(([f,v]) => [f, Number(v)]).filter(([,v]) => Number.isFinite(v))
    .sort((a,b) => (parseInt(a[0])||0) - (parseInt(b[0])||0));
  if (!entries.length) return `<p class="absent">No per floor values.</p>`;
  const W = 820, H = 30 + entries.length * 18, L = 46;
  const cr = rec.criteria||{};
  const blo = num(cr.stair_band_min), bhi = num(cr.stair_band_max);
  // The band guides are part of the domain, so a profile that sits entirely
  // inside the band still shows where the band edges are.
  const max = Math.max(...entries.map(e => e[1]), bhi || 0) * 1.15 || 1;
  const x = v => L + (v / max) * (W - L - 70);
  const bars = entries.map((e,i) => {
    const y = 20 + i*18;
    const over = bhi!=null && e[1] > bhi, under = blo!=null && e[1] < blo;
    const col = over || under ? "var(--missing)" : "var(--accent)";
    return `<text x="0" y="${y+9}">L${esc(e[0])}</text>
      <rect x="${L}" y="${y}" width="${(x(e[1])-L).toFixed(1)}" height="11" rx="2" fill="${col}"/>
      <text x="${(x(e[1])+5).toFixed(1)}" y="${y+9}">${e[1].toFixed(3)}</text>`;
  }).join("");
  const guide = (v,label) => v==null ? "" :
    `<line x1="${x(v)}" y1="14" x2="${x(v)}" y2="${H-6}" stroke="var(--line)"
      stroke-dasharray="3 3"/><text x="${x(v)+2}" y="12">${label}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
    aria-label="Per floor pressure profile">${guide(blo,blo)}${guide(bhi,bhi)}${bars}</svg>`;
}

function tabConflicts(rec){
  const cs = ((rec._meta||{}).conflicts||[]).slice()

      || String(a.id).localeCompare(String(b.id)));
  if (!cs.length) return `<div class="card absent">No open or resolved items recorded.</div>`;
  const rows = cs.map(c => `<tr>
    <td><strong>${esc(c.id)}</strong><div class="small muted">${esc(c.category||"")}</div></td>
    <td>${esc(c.item)}<div class="small muted">${esc(c.known||"")}</div></td>
    <td class="small">${esc(c.action||"")}</td>

    <div class="card scroll"><table>
      <thead><tr><th>Id</th><th>Item</th><th>Action</th><th>Priority</th>
      <th></th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function tabFiles(rec){
  const files = rec.files||[];
  if (!files.length) return `<div class="card absent">No files indexed on this record.</div>`;
  return `<p class="small muted">The viewer reads the index, never the folder. An

/* ---------- report: hand the record to Claude or Grokbot ------------------
   The SC Inspect pattern. The Word document is built by the eb-scra plugin's
   own engine (scra-report skill) in a Claude session, never in this page. The
   viewer only composes the ask: a prompt for Claude, or a Handoff packet for
   the Grokbot desks. Nothing here writes to the record, the repository or the
   folder. A packet carries paths and state, never numbers: measured values do
   not travel through Handoff, the package folder is their source of truth. */

const CHASSIS = {
  new:      {label: "New construction", asset: "SCRA_TEMPLATE_New_AnyCount.docx"},
  existing: {label: "Existing building", asset: "SCRA_TEMPLATE_Existing_AnyCount.docx"}
};

function walkValues(o, fn){
  if (!o || typeof o !== "object") return;
  if (Array.isArray(o)){ o.forEach(x => walkValues(x, fn)); return; }
  if ("value" in o && ("source" in o || "measured" in o || "placeholder" in o)) fn(o);
  Object.values(o).forEach(x => walkValues(x, fn));
}

function reportState(slug, rec){
  const pkg = (DATA.index.packages || []).find(x => x.slug === slug) || {};
  const bs = (rec.building || {}).building_status || null;
  const open = openConflicts(rec), blocking = open.filter(c => c.blocking);
  let placeholders = 0, missing = 0;
  [rec.stairs, rec.elevators, rec.other_systems].forEach(list => walkValues(list || [], v => {
    if (v.placeholder || v.source === "trendline") placeholders++;
    if (v.value === null) missing++;
  }));
  const lint = pkg.lint || {};
  const lintErrors = lint.ran ? (lint.findings || []).filter(f => f.level === "ERROR") : [];
  const meta = rec._meta || {}, run = (rec.contam || {}).run || {};
  const chassis = CHASSIS[bs] || null;
  const reasons = [];
  if (blocking.length) reasons.push(blocking.length + " open blocking item" + (blocking.length > 1 ? "s" : "")
    + " (" + blocking.map(c => c.id).join(", ") + ")");
  if (placeholders) reasons.push(placeholders + " placeholder value" + (placeholders > 1 ? "s" : ""));
  if (missing) reasons.push(missing + " missing value" + (missing > 1 ? "s" : ""));
  if (lintErrors.length) reasons.push(lintErrors.length + " lint error" + (lintErrors.length > 1 ? "s" : ""));
  if (lint.ran === false) reasons.push("lint did not run at index time");
  return {
    pkg, bs, chassis, open, blocking, placeholders, missing, lint, lintErrors, reasons,
    name: (rec.info || {}).ProjectName || pkg.name || slug,
    location: [(rec.info || {}).ProjectLocation].filter(Boolean).join(", ") || pkg.location || "",
    ahj: (rec.info || {}).AHJ || null,
    sealed: !!(rec.seal || {}).sealed,
    lastWriteAt: meta.lastWriteAt || pkg.lastWriteAt || null,
    lastWriteBy: meta.lastWriteBy || pkg.lastWriteBy || null,
    stamp: run.stamp || pkg.stamp || null,
    runId: run.run_id || pkg.run_id || null,
    draftOnly: reasons.length > 0,
    docs: (rec.files || []).map(f => f.name || f.id || "").filter(n => /(^|\/)docs\//.test(n) || /\.docx$/i.test(n))
  };
}

function recordPath(slug){ return "Grokbot/SCRA-Projects/" + slug + "/project.json"; }
function recordFileName(slug){ return slug + "_project.json"; }
function todayET(){
  try { return new Intl.DateTimeFormat("en-CA", {timeZone: "America/New_York"}).format(new Date()); }
  catch { return new Date().toISOString().slice(0, 10); }
}
function versionLine(st){
  return "last written " + (st.lastWriteAt || "(time not recorded)") + " by " + (st.lastWriteBy || "(not recorded)")
    + (st.stamp ? ", Contam run " + st.stamp : ", no Contam run on the record");
}
function stateLine(st){
  if (!st.chassis) return "The record has no building_status, so the chassis cannot be chosen. Stop and raise it as a conflict rather than picking one.";
  return st.draftOnly
    ? "Draft only, not sealable as it stands: " + st.reasons.join("; ") + "."
    : "No open blocking items, placeholders, missing values or lint errors at index time.";
}

function claudePrompt(slug, rec){

    "",

    "",
    "Chassis: " + (st.chassis ? st.chassis.label + " (building_status \"" + st.bs + "\", " + st.chassis.asset + ")" : "MISSING") + ".",
    "State: " + stateLine(st),
    "",

    "Write the draft to this building's Grokbot project folder, verify it by size and by opening it, and put a *_done.md note in Grokbot/Handoff/outbox/ naming the file, anything you changed on the record, and the open items."

function grokbotPacket(slug, rec){
  const st = reportState(slug, rec), d = todayET();
  const L = [];
  L.push("# " + st.name + " SCRA report ready for Claude Desktop", "");
  L.push("**Status:** ready  ", "**Date:** " + d + "  ", "**From:** SCRA viewer, for William  ",
         "**For:** Claude Desktop (heavy Word)  ", "**Project:** " + st.name + (st.location ? ", " + st.location : "") + "  ",
         "**Deliverable type:** SCRA  ",
         "**Jurisdiction / code stack:** " + (st.ahj ? "AHJ " + st.ahj + "; confirm code editions from the record" : "AHJ not recorded on the record; confirm") + "  ", "");
  L.push("## Bottom line ask", "",
    "Build the SCRA Word report from `" + recordPath(slug) + "` with the eb-scra plugin, scra-report skill, on the "
    + (st.chassis ? st.chassis.label.toLowerCase() + " chassis (`" + st.chassis.asset + "`)" : "chassis the record's building_status selects. building_status is MISSING, so stop and raise it") + ".", "");
  L.push("## Inputs (links / paths)", "",
    "- Record: `" + recordPath(slug) + "`. Read it as it is now. When this packet was made the viewer saw it " + versionLine(st) + ". If it is newer, use it and say so.",
    "- Run evidence: " + (st.stamp ? "`Grokbot/SCRA-Projects/" + slug + "/runs/" + st.stamp + "/`" : "none on the record"),
    "- Exemplar chassis: chosen by building_status, not by this packet",
    "- Prior drafts indexed on the record: " + (st.docs.length ? st.docs.map(n => "`" + n + "`").join(", ") : "none"), "");
  L.push("## Record state when this packet was made", "",
    "- " + stateLine(st),
    "- Open conflicts: " + st.open.length + " (" + st.blocking.length + " blocking)",
    "- Sealed: " + (st.sealed ? "yes" : "no"), "");
  L.push("## Constraints", "",
    "- Numbers come from the record only. This packet carries none on purpose; measured values do not travel through Handoff.",
    "- Do not invent CFM, pressure difference, floor heights, leakage classes, fees or pass/fail.",
    "- Do not seal. `sealed` stays false until William sets it.",
    "- The chassis follows building_status. If anything here disagrees with the record, the record wins; say so in the done note.",
    "- No em dashes in William-facing prose.", "");
  L.push("## Definition of done", "",
    "- [ ] Draft .docx in this building's `Grokbot/{Project}/` folder, verified by size and by opening it",
    "- [ ] Short `*_done.md` note in `Grokbot/Handoff/outbox/` with the path, any record changes, and next CoS action",
    "- [ ] Every lint ERROR, filled BLANK and placeholder flagged explicitly", "");
  return {name: d + "_" + slug + "_scra-report_ready.md", text: L.join("\n")};
}

function canShareFiles(){
  try { return !!(navigator.canShare && navigator.share
    && navigator.canShare({files: [new File(["{}"], "x.json", {type: "application/json"})]})); }
  catch { return false; }
}
function downloadFile(file){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch { return false; }
}
/* Share sheet where the device has one (phone to Claude, or to OneDrive),
   otherwise a download. Returns "shared", "saved", or "cancelled". */
async function shareOrSave(file, title){
  if (canShareFiles()){
    try { await navigator.share({files: [file], title}); return "shared"; }
    catch (e){ if (e && e.name === "AbortError") return "cancelled"; }
  }
  try { downloadFile(file); return "saved"; } catch { return "failed"; }
}
function rmsg(id, t){ const el = document.getElementById(id); if (el) el.textContent = t; }

async function reportSendClaude(slug){

  if (how === "cancelled"){ rmsg("rp_c_msg", copied ? "Prompt copied. Sharing cancelled." : "Sharing cancelled."); return; }
  rmsg("rp_c_msg", {
    shared: copied ? "Prompt copied and record shared. In Claude, paste the prompt and send it with the file."

    saved:  copied ? "Prompt copied and " + recordFileName(slug) + " saved. Attach it in Claude and paste the prompt."

    failed: copied ? "Prompt copied. The record could not be saved on this device; on fletcher-pc Claude reads the folder copy anyway."

function trendPoints(){
  const pts = [];
  Object.entries(DATA.records).forEach(([slug, rec]) => {
    const bal = ((rec.contam||{}).balance)||{};
    systemsOf(rec).forEach(({cls,s}) => {
      const d = num(s.design);
      if (d === null) return;
      const b = bal[s.id]||{};
      pts.push({
        slug, project:(rec.info||{}).ProjectName||slug,
        cls, label:s.label||s.id,
        design:d,
        levels:Number(s.levels_served_count) || null,
        stories:Number((rec.building||{}).NumberofStories) || null,
        track:(rec.building||{}).building_status || null,
        vestibule: cls==="stair" ? !!s.vestibule : null,
        arch:(s.injection||{}).architecture || null,
        chip: chipOf(s.design),
        spread: b.spread_ratio ?? null,
        dpmax: b.dp_max_achieved ?? null,
        climate:(rec.climate||{}).NearestAirport || null,
      });
    });
  });
  return pts;
}

function scatter(pts, xk, yk, xlabel, ylabel){
  const usable = pts.filter(p => p[xk] != null && p[yk] != null);
  if (usable.length < 1)
    return `<div class="card"><h3>${esc(ylabel)} against ${esc(xlabel)}</h3>
      <p class="absent">Nothing plottable yet. A point is drawn only where both values
      are on a record. Nothing is estimated into a chart.</p></div>`;
  const W=560,H=240,P=42;
  const xs = usable.map(p=>p[xk]), ys = usable.map(p=>p[yk]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=0, y1=Math.max(...ys);
  const sx = v => P + (x1===x0 ? .5 : (v-x0)/(x1-x0)) * (W-P-18);
  const sy = v => H-P - (y1===y0 ? .5 : (v-y0)/(y1-y0)) * (H-P-18);
  const marks = usable.map(p => {
    const cx=sx(p[xk]).toFixed(1), cy=sy(p[yk]).toFixed(1);
    const fill = p.chip==="measured" ? "var(--measured)"
      : p.chip==="placeholder" ? "none" : "var(--stated)";
    const stroke = p.chip==="placeholder" ? "var(--placeholder)" : "none";
    const shape = p.cls==="stair"
      ? `<circle cx="${cx}" cy="${cy}" r="5" fill="${fill}" stroke="${stroke}"
           stroke-width="2" stroke-dasharray="2 2"/>`
      : `<rect x="${cx-5}" y="${cy-5}" width="10" height="10" fill="${fill}"
           stroke="${stroke}" stroke-width="2" stroke-dasharray="2 2"/>`;
    return `<g><title>${esc(p.project)} ${esc(p.label)}: ${xlabel} ${p[xk]}, ${ylabel} ${p[yk]}</title>${shape}</g>`;
  }).join("");
  return `<div class="card"><h3>${esc(ylabel)} against ${esc(xlabel)}</h3>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="${esc(ylabel)} against ${esc(xlabel)}">
      <line x1="${P}" y1="${H-P}" x2="${W-10}" y2="${H-P}" stroke="var(--line)"/>
      <line x1="${P}" y1="14" x2="${P}" y2="${H-P}" stroke="var(--line)"/>
      <text x="${P}" y="${H-P+16}">${x0}</text>
      <text x="${W-40}" y="${H-P+16}">${x1}</text>
      <text x="4" y="${H-P}">${y0}</text>
      <text x="4" y="22">${typeof y1==="number"?y1.toLocaleString():y1}</text>
      ${marks}
    </svg>
    <p class="small muted">Circle stair, square bank. Filled measured, dashed outline
      placeholder. ${usable.length} of ${pts.length} points carry both values.${
      x1===x0 ? " Every point shares the same "+esc(xlabel)+", so the horizontal axis says nothing yet." : ""}</p></div>`;
}

function viewTrends(){
  const pts = trendPoints();
  const n = Object.keys(DATA.records).length;
  const measured = pts.filter(p => p.chip === "measured").length;
  const placeholder = pts.filter(p => p.chip === "placeholder").length;
  const tracks = {};
  pts.forEach(p => { tracks[p.track||"missing"] = (tracks[p.track||"missing"]||0)+1; });
  const vest = pts.filter(p => p.cls==="stair" && p.dpmax!=null);
  const vestRows = vest.length ? vest.map(p => `<tr><td>${esc(p.project)} ${esc(p.label)}</td>
      <td>${p.vestibule?"yes":"no"}</td><td>${p.dpmax.toFixed(3)}</td></tr>`).join("")
    : `<tr><td colspan="3" class="absent">No achieved pressures recorded yet.</td></tr>`;
  const archRows = pts.filter(p=>p.arch).map(p =>
    `<tr><td>${esc(p.project)} ${esc(p.label)}</td><td>${esc(p.arch)}</td>
     <td>${p.stories ?? "?"}</td><td>${p.levels ?? "?"}</td></tr>`).join("")
    || `<tr><td colspan="4" class="absent">No injection architecture recorded.</td></tr>`;

  return `
  <div class="ro">Every point carries its provenance and nothing is estimated into a
    chart. A system with no recorded design CFM is left out of a trend rather than
    filled in. With one measured package these charts are a scaffold, not a finding.</div>

  <div class="grid">
    <div class="card"><h3>Portfolio coverage</h3>
      <p><strong>${n}</strong> package${n===1?"":"s"}, <strong>${pts.length}</strong>
        sized system${pts.length===1?"":"s"}.</p>
      <div class="bar" style="margin:8px 0">
        <i style="width:${pts.length?measured/pts.length*100:0}%;background:var(--measured)"></i>
        <i style="width:${pts.length?placeholder/pts.length*100:0}%;background:var(--placeholder)"></i>
      </div>
      <p class="small">${measured} measured, ${placeholder} placeholder,
        ${pts.length-measured-placeholder} other. How much of the portfolio is running
        on seeds rather than on results.</p>
      <p class="small muted">Systems by track: ${Object.entries(tracks)
        .map(([k,v])=>`${v} ${k}`).join(", ")}.</p>
    </div>
    ${scatter(pts,"levels","design","levels served","design cfm")}
    ${scatter(pts,"stories","spread","stories","spread ratio")}
  </div>

  <h3>Vestibule against achieved pressure</h3>
  <div class="card scroll"><table>
    <thead><tr><th>System</th><th>Vestibule</th><th>dP max achieved</th></tr></thead>
    <tbody>${vestRows}</tbody></table></div>

  <h3>Injection architecture against height</h3>
  <div class="card scroll"><table>
    <thead><tr><th>System</th><th>Architecture</th><th>Stories</th><th>Levels served</th></tr></thead>
    <tbody>${archRows}</tbody></table></div>
  <p class="small muted">The orientation brief's heuristic is single roof to roughly
    20 stories, top and bottom to 33, multi point above. This table is what says
    whether that holds once there are enough measured packages to look at.</p>`;
}

function wireSettings(){
  const msg = $("#cf_msg");
  const gather = () => ({
    owner: ($("#cf_owner").value || "").trim(),
    repo: ($("#cf_repo").value || "").trim(),
    branch: ($("#cf_branch").value || "main").trim(),
    token: ($("#cf_token").value || "").trim() || CFG.token || ""
  });
  const say = (t, bad) => { if (msg){ msg.textContent = t;
    msg.className = "small " + (bad ? "chip c-missing" : "muted"); } };

  const test = $("#cf_test");
  if (test) test.onclick = async () => {
    const c = gather();
    if (!(c.owner && c.repo && c.token)) return say("Owner, repository and token are all needed.", true);
    say("Checking...");
    try { say(await testConnection(c)); }
    catch (e){ say(e.message, true); }
  };
  const save = $("#cf_save");
  if (save) save.onclick = async () => {
    const c = gather();
    if (!(c.owner && c.repo && c.token)) return say("Owner, repository and token are all needed.", true);
    CFG = c;
    say(saveCfg(CFG) ? "Saved on this device. Loading..." : "Could not save to this browser.", false);
    await boot();
  };
  const forget = $("#cf_forget");
  if (forget) forget.onclick = () => {
    if (!confirm("Remove the token and the cached records from this device?")) return;
    try { localStorage.removeItem(LS_CFG); localStorage.removeItem(LS_CACHE); } catch {}
    CFG = {}; DATA = window.SCRA_DATA || null; SOURCE = DATA ? "local" : "none";
    render();
  };
  const refresh = $("#cf_refresh");
  if (refresh) refresh.onclick = () => boot();
  const copy = $("#cf_copy");
  if (copy) copy.onclick = () => {
    navigator.clipboard.writeText(setupLink())
      .then(() => say("Setup link copied. Send it like a password."))
      .catch(() => say("Copy failed. Use the QR code instead.", true));
  };
  const paste = $("#cf_paste");
  if (paste) paste.onclick = () => {
    const t = prompt("Paste the setup link");
    if (!t) return;
    try {
      const o = parseSetup(t);
      CFG = {owner: o.o, repo: o.r, token: o.t, branch: "main"};
      saveCfg(CFG); boot();
    } catch (e){ say(e.message, true); }
  };
  const box = $("#qrbox");
  if (box && typeof qrCanvas === "function"){
    try { box.appendChild(qrCanvas(setupLink(), 5)); }
    catch { box.innerHTML = '<p class="absent">Setup link is too long for a QR code. Use Copy setup link.</p>'; }
  }
}

/* ---------- render -------------------------------------------------------- */
function render(){
  const {view, slug, sub} = route();
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.view === (view==="project"?"list":view))));
  document.getElementById("genstamp").textContent = DATA
    ? `${DATA.index.count} package${DATA.index.count===1?"":"s"}`
      + (SOURCE === "cache" ? ", held on this device" : "")
    : "not set up";

  if (view === "settings"){ main.innerHTML = viewSettings(); wireSettings();
    window.scrollTo(0,0); return; }

  if (!DATA){
    const configured = !!(CFG.owner && CFG.repo && CFG.token);
    main.innerHTML = `<div class="banner"><strong>No records loaded.</strong>
      ${LOADERR ? esc(LOADERR) : configured
        ? "The token is saved but nothing came back yet."
        : "This device has not been set up. Open Settings and paste the setup link, "
          + "or scan the QR code from a device that is already working."}</div>
      <p class="small muted">Opened from the OneDrive folder instead, this page reads
        <code>packages.js</code> beside it and needs no token at all.</p>
      <div class="row"><button onclick="location.hash='settings'">Open Settings</button></div>`;
    window.scrollTo(0,0); return;
  }

  if (view === "project" && slug) main.innerHTML = viewProject(slug, sub);
  else if (view === "trends") main.innerHTML = viewTrends();
  else if (view === "about") main.innerHTML = viewAbout();
  else { main.innerHTML = viewList(); wireList(); }
  window.scrollTo(0,0);
}

if (!setupFromHash()) boot();
</script>
</body>
</html>
